<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tipo de Triángulo</title>
    <link rel="stylesheet" href="estilo.css">
</head>
<body>

<h1>Calculadora de Triángulos</h1>

<div class="contenedor">
    <div class="inputs">
        <label>Lado 1</label>
        <input type="number" id="lado1" placeholder="Ej: 5">

        <label>Lado 2</label>
        <input type="number" id="lado2" placeholder="Ej: 5">

        <label>Lado 3</label>
        <input type="number" id="lado3" placeholder="Ej: 5">

        <button onclick="calcular()">Calcular</button>
    </div>

    <div class="resultado">
        <h3>Resultado</h3>
        <p id="tipo"></p>
        <p id="area"></p>
    </div>
</div>

<!-- Canvas fuera del contenedor principal -->
<div class="canvas-contenedor">
    <canvas id="canvasTriangulo" width="450" height="320"></canvas>
</div>

<script src="script.js"></script>
</body>
</html>
